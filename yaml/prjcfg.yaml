title: Project Configuration
desc: 'Project configuration for the FW: Project Setting, Application Setting and
  Scan Arrangement. Replaces prjcfg.xlsx; edit it in SenseTool, which generates the
  C code.'
revisions:
- date: '2023-04-26'
  desc: First draft of skeleton
- date: '2023-08-18'
  desc: Update PrjSet to include Frame Size macro
- date: '2023-08-18'
  desc: Remove tab AppSet(O)
- date: '2023-08-18'
  desc: Update Appset to increase entry record to support size of 1K byte
- date: '2023-10-12'
  desc: Update PrjSet to include panel compensation size(Cx , Ix)
prjset:
