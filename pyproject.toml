[project]
name = "sensetool"
version = "0.0.0"
description = "SenseTool - Viewtrix project configuration tool"
# PySide6 6.7.1 publishes wheels for Python 3.9-3.12 only.
requires-python = ">=3.9,<3.13"
# Keep in sync with requirements.txt (used by CI).
dependencies = [
    "PySide6==6.7.1",
    "PySide6_Addons==6.7.1",
    "PySide6_Essentials==6.7.1",
    "PyYAML==6.0.1",
    "shiboken6==6.7.1",
    "requests==2.32.3",
    "openpyxl==3.1.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage>=7.10.7",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["resource_rc.py", "env"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import sorting is not enforced
select = ["F", "E", "W", "B"]
ignore = [
    "E731",  # small lambdas are used for readability in tests
    "B008",  # parent=QModelIndex() defaults are the Qt idiom
]
