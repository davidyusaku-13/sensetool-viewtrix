[General]
# The QML linter, run in CI: uv run pyside6-qmllint $(find qml -name '*.qml')
[Warnings]
# Environment noise: qmllint can't see the PySide-registered modules, and the
# PySide Qt build ships the QtQuick.Dialogs types twice ("ambiguous type").
ImportFailure=disable
# Callback properties (EditWindow.save, SelectableTable.filter, ...) return a
# value, which a signal can't, so they are variant properties by design.
UseProperFunction=disable
