name: CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release"
        required: true
        default: false
        type: boolean
      version_bump:
        description: "Version bump type (only if release is true)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

env:
  QT_VERSION: "6.8.0"
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  # ============================================
  # TEST JOB - Runs on all triggers
  # ============================================
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-tools-dev qml6-module-qtqml-workerscript qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qt5compat-graphicaleffects
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
          sudo apt-get install -y libegl1 libxcb-cursor0
          echo "/usr/lib/qt6/bin" >> $GITHUB_PATH

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt6
          echo "$(brew --prefix qt6)/bin" >> $GITHUB_PATH

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtcharts qt5compat qtshadertools"
          cache: true

      - name: Add Qt bin to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:RUNNER_WORKSPACE "Qt"
          if (!(Test-Path $qtRoot)) {
            Write-Error "Qt installation root not found at $qtRoot"
            exit 1
          }

          $qmlTestRunner = Get-ChildItem -Path $qtRoot -Filter "qmltestrunner.exe" -File -Recurse |
            Select-Object -First 1

          if (-not $qmlTestRunner) {
            Write-Error "Unable to locate qmltestrunner.exe under $qtRoot"
            exit 1
          }

          $qmlTestRunner.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: pytest tests/ -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: pytest tests/ -v --tb=short

      - name: Run QML tests (Windows)
        if: runner.os == 'Windows'
        run: qmltestrunner.exe -input tests/qmlUnitTests

      - name: Run QML tests (Linux)
        if: runner.os == 'Linux'
        run: qmltestrunner -platform offscreen -input tests/qmlUnitTests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QSG_RHI_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Run QML tests (macOS)
        if: runner.os == 'macOS'
        run: qmltestrunner -input tests/qmlUnitTests

  # ============================================
  # SECURITY JOB - Runs on all triggers
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          pip install -r requirements.txt

      - name: Run bandit security scan
        shell: bash
        run: |
          set +e
          bandit -r src/ -f json -o bandit-report.json
          bandit_exit=$?
          set -e

          if [ ! -f bandit-report.json ]; then
            echo "Bandit did not produce a JSON report"
            exit $bandit_exit
          fi

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("bandit-report.json").read_text(encoding="utf-8"))
          high_findings = [
              issue for issue in report.get("results", [])
              if issue.get("issue_severity") == "HIGH"
          ]

          if not high_findings:
              print("No high-severity Bandit findings.")
              sys.exit(0)

          print(f"High-severity Bandit findings: {len(high_findings)}")
          for issue in high_findings[:20]:
              print(
                  f"- {issue.get('filename')}:{issue.get('line_number')} "
                  f"{issue.get('test_id')} {issue.get('issue_text')}"
              )
          sys.exit(1)
          PY

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn

  # ============================================
  # VERSION JOB - Only runs for releases
  # ============================================
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    if: github.event.inputs.release == 'true'
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      current_version: ${{ steps.current.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: current
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT_VERSION=${LATEST_TAG#v}
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Bump version
        id: bump
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          BUMP_TYPE="${{ github.event.inputs.version_bump }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=${PATCH%%-*}

          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION (bumped $BUMP_TYPE from $CURRENT)"

  # ============================================
  # BUILD JOB - Only runs for releases
  # ============================================
  build:
    name: Build (${{ matrix.os }})
    needs: [test, security, version]
    if: github.event.inputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: sensetool-windows
            executable: sensetool.exe
            qt_arch: win64_mingw
          - os: ubuntu-latest
            artifact_name: sensetool-linux
            executable: sensetool
            qt_arch: gcc_64
          - os: macos-latest
            artifact_name: sensetool-macos
            executable: sensetool.app
            qt_arch: clang_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-tools-dev qml6-module-qtqml-workerscript qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qt5compat-graphicaleffects
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
          sudo apt-get install -y libegl1 libxcb-cursor0 patchelf

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt6
          echo "$(brew --prefix qt6)/bin" >> $GITHUB_PATH

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: "windows"
          target: "desktop"
          arch: ${{ matrix.qt_arch }}
          modules: "qtcharts qt5compat qtshadertools"
          cache: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install invoke
          pip install -r requirements.txt
          pip install imageio

      - name: Update package version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          Path("src/version.py").write_text(
              '__version__ = "${{ needs.version.outputs.new_version }}"\n',
              encoding="utf-8",
          )
          PY

      - name: Prepare CI deploy spec
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          source = Path("pysidedeploy.spec")
          target = Path("pysidedeploy.ci.spec")
          python_path_line = "python_path = "

          updated_lines = []
          replaced = False
          for line in source.read_text(encoding="utf-8").splitlines():
              if line.startswith(python_path_line):
                  updated_lines.append(f"{python_path_line}{sys.executable}")
                  replaced = True
              else:
                  updated_lines.append(line)

          if not replaced:
              raise SystemExit("python_path entry not found in pysidedeploy.spec")

          target.write_text("\n".join(updated_lines) + "\n", encoding="utf-8")
          print(f"Generated {target} with python_path={sys.executable}")
          PY

      - name: Build resources
        run: pyside6-rcc ./resource.qrc -o ./resource_rc.py

      - name: Build application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyside6-deploy -c pysidedeploy.ci.spec -f
          $exeFiles = Get-ChildItem -Filter "*.exe" | Where-Object { $_.Name -ne "sensetool.exe" }
          if ($exeFiles) {
            $firstExe = $exeFiles[0]
            Rename-Item -Path $firstExe.FullName -NewName "sensetool.exe"
            Write-Host "Renamed $($firstExe.Name) to sensetool.exe"
          } elseif (Test-Path "sensetool.exe") {
            Write-Host "sensetool.exe already exists"
          } else {
            Write-Error "No executable found after build"
            exit 1
          }

      - name: Build application (Linux)
        if: runner.os == 'Linux'
        run: |
          pyside6-deploy -c pysidedeploy.ci.spec -f
          if [ -f "SenseTool" ]; then
            mv SenseTool sensetool
          elif [ -f "SenseTool.bin" ]; then
            mv SenseTool.bin sensetool
          elif [ -f "main" ]; then
            mv main sensetool
          elif [ -f "main.bin" ]; then
            mv main.bin sensetool
          elif [ -f "deployment/SenseTool" ]; then
            mv deployment/SenseTool sensetool
          elif [ -f "deployment/SenseTool.bin" ]; then
            mv deployment/SenseTool.bin sensetool
          elif [ -f "deployment/main" ]; then
            mv deployment/main sensetool
          elif [ -f "deployment/main.bin" ]; then
            mv deployment/main.bin sensetool
          else
            echo "No Linux executable found after build"
            find . -maxdepth 2 -type f -perm -111 -print
            exit 1
          fi
          chmod +x sensetool

      - name: Build application (macOS)
        if: runner.os == 'macOS'
        run: |
          pyside6-deploy -c pysidedeploy.ci.spec -f
          if [ -d "SenseTool.app" ]; then
            mv SenseTool.app sensetool.app
          elif [ -d "main.app" ]; then
            mv main.app sensetool.app
          elif [ -d "deployment/SenseTool.app" ]; then
            mv deployment/SenseTool.app sensetool.app
          elif [ -d "deployment/main.app" ]; then
            mv deployment/main.app sensetool.app
          else
            echo "No macOS app bundle found after build"
            find . -maxdepth 3 -name "*.app" -type d -print
            exit 1
          fi

      - name: Verify build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "sensetool.exe")) {
            Write-Error "Build verification failed: sensetool.exe not found"
            Get-ChildItem
            exit 1
          }
          $fileSize = (Get-Item "sensetool.exe").Length
          Write-Host "Build successful. File size: $fileSize bytes"

      - name: Verify build (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -f "sensetool" ]; then
            echo "Build verification failed: sensetool not found"
            ls -la
            exit 1
          fi
          echo "Build successful. File size: $(stat -c%s sensetool) bytes"

      - name: Verify build (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ ! -d "sensetool.app" ]; then
            echo "Build verification failed: sensetool.app not found"
            ls -la
            exit 1
          fi
          echo "Build successful"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path sensetool.exe -DestinationPath "${{ matrix.artifact_name }}-${{ needs.version.outputs.new_version }}.zip"

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf "${{ matrix.artifact_name }}-${{ needs.version.outputs.new_version }}.tar.gz" sensetool

      - name: Create archive (macOS)
        if: runner.os == 'macOS'
        run: |
          zip -r "${{ matrix.artifact_name }}-${{ needs.version.outputs.new_version }}.zip" sensetool.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}-${{ needs.version.outputs.new_version }}.*
          retention-days: 7

  # ============================================
  # RELEASE JOB - Only runs for releases
  # ============================================
  release:
    name: Create Release
    needs: [version, build]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sensetool-*
          path: ./artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find ./artifacts -type f -name "*.*"

      - name: Ensure release tag exists
        id: tag
        run: |
          git fetch --tags --force
          TAG_NAME="v${{ needs.version.outputs.new_version }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists; reusing it."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            ./artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## Release Created Successfully! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.tag.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bump Type:** ${{ github.event.inputs.version_bump }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release:** ${{ github.event.inputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
