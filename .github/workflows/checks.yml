name: Checks

on:
  workflow_call:
  workflow_dispatch:

env:
  QT_VERSION: "6.8.0"
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-tools-dev qml6-module-qtqml-workerscript qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qt5compat-graphicaleffects
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
          sudo apt-get install -y libegl1 libxcb-cursor0
          echo "/usr/lib/qt6/bin" >> $GITHUB_PATH

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt6
          echo "$(brew --prefix qt6)/bin" >> $GITHUB_PATH

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtcharts qt5compat qtshadertools"
          cache: true

      - name: Add Qt bin to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtRoot = Join-Path $env:RUNNER_WORKSPACE "Qt"
          if (!(Test-Path $qtRoot)) {
            Write-Error "Qt installation root not found at $qtRoot"
            exit 1
          }

          $qmlTestRunner = Get-ChildItem -Path $qtRoot -Filter "qmltestrunner.exe" -File -Recurse |
            Select-Object -First 1

          if (-not $qmlTestRunner) {
            Write-Error "Unable to locate qmltestrunner.exe under $qtRoot"
            exit 1
          }

          $qmlTestRunner.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: pytest tests/ -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: pytest tests/ -v --tb=short

      - name: Run QML tests (Windows)
        if: runner.os == 'Windows'
        run: qmltestrunner.exe -input tests/qmlUnitTests

      - name: Run QML tests (Linux)
        if: runner.os == 'Linux'
        run: qmltestrunner -platform offscreen -input tests/qmlUnitTests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QSG_RHI_BACKEND: software
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Run QML tests (macOS)
        if: runner.os == 'macOS'
        run: qmltestrunner -input tests/qmlUnitTests

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          pip install -r requirements.txt

      - name: Run bandit security scan
        shell: bash
        run: |
          set +e
          bandit -r src/ -f json -o bandit-report.json
          bandit_exit=$?
          set -e

          if [ ! -f bandit-report.json ]; then
            echo "Bandit did not produce a JSON report"
            exit $bandit_exit
          fi

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("bandit-report.json").read_text(encoding="utf-8"))
          high_findings = [
              issue for issue in report.get("results", [])
              if issue.get("issue_severity") == "HIGH"
          ]

          if not high_findings:
              print("No high-severity Bandit findings.")
              sys.exit(0)

          print(f"High-severity Bandit findings: {len(high_findings)}")
          for issue in high_findings[:20]:
              print(
                  f"- {issue.get('filename')}:{issue.get('line_number')} "
                  f"{issue.get('test_id')} {issue.get('issue_text')}"
              )
          sys.exit(1)
          PY

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn
