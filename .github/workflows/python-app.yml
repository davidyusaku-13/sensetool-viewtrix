name: SenseTool CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: write

jobs:
  build:
    name: SenseTool Testing & Deployment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: "5.x"

      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v1.1.1

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Nuitka build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Cache
            **\__pycache__
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt', 'pysidedeploy.spec') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtcharts qt5compat qtshadertools"
          dir: "${{ github.workspace }}/Qt/"
          install-deps: "true"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install invoke
          pip install -r requirements.txt

      - name: Add qmltestrunner to PATH
        run: |
          echo "${{ github.workspace }}\Qt\6.7.0\win64_mingw\bin" >> $env:GITHUB_PATH

      - name: Testing pyUnit and QMLUnit
        run: |
          invoke test

      - name: Save CHANGELOG for release body
        shell: pwsh
        run: |
          Copy-Item CHANGELOG.md release-body.md


      - name: Write Version
        run: |
          echo "${{ steps.version_step.outputs.GitVersion_FullSemVer }}" > ./VERSION.txt

      - name: Build App
        run: |
          invoke deploy
          Rename-Item -Path "main.exe" -NewName "sensetool-${{ steps.version_step.outputs.GitVersion_FullSemVer }}.exe"

      - name: Create Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.GitVersion_FullSemVer }}
          name: Release ${{ steps.version_step.outputs.GitVersion_FullSemVer }}
          body_path: release-body.md
          draft: false
          prerelease: false
          files: sensetool-${{ steps.version_step.outputs.GitVersion_FullSemVer }}.exe
