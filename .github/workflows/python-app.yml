name: SenseTool CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: write

jobs:
  build:
    name: SenseTool Testing & Deployment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: "5.x"

      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v1.1.1

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Nuitka build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Cache
            **\__pycache__
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements.txt', 'pysidedeploy.spec') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.0"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtcharts qt5compat qtshadertools"
          dir: "${{ github.workspace }}/Qt/"
          install-deps: "true"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install invoke
          pip install -r requirements.txt

      - name: Add qmltestrunner to PATH
        run: |
          echo "${{ github.workspace }}\Qt\6.7.0\win64_mingw\bin" >> $env:GITHUB_PATH

      - name: Testing pyUnit and QMLUnit
        run: |
          invoke test

      - name: Generate release body from git log
        shell: pwsh
        run: |
          # Determine previous tag to diff against
          $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if (-not $prevTag) {
            Write-Host "No previous tag found, using full history"
            $log = git log --oneline --no-merges --format="- %s (%h)"
          } else {
            Write-Host "Generating release body since $prevTag"
            $log = git log $prevTag..HEAD --oneline --no-merges --format="- %s (%h)"
          }
          $body = @()
          $body += "## What's Changed"
          $body += ""
          # Categorize by conventional commit type
          $features = $log | Select-String "^\- feat(\(.*?\))?:" | ForEach-Object { "$_" }
          $fixes    = $log | Select-String "^\- fix(\(.*?\))?:"   | ForEach-Object { "$_" }
          $refactor = $log | Select-String "^\- refactor(\(.*?\))?:" | ForEach-Object { "$_" }
          $ci       = $log | Select-String "^\- ci(\(.*?\))?:"   | ForEach-Object { "$_" }
          $docs     = $log | Select-String "^\- docs(\(.*?\))?:" | ForEach-Object { "$_" }
          $others   = $log | Where-Object { $_ -notmatch "^\- (feat|fix|refactor|ci|docs)(\(.*?\))?" } | ForEach-Object { "$_" }
          if ($features) { $body += "### Features"; $body += ""; $body += $features; $body += "" }
          if ($fixes)    { $body += "### Bug Fixes"; $body += ""; $body += $fixes; $body += "" }
          if ($refactor) { $body += "### Refactoring"; $body += ""; $body += $refactor; $body += "" }
          if ($ci)       { $body += "### CI/CD"; $body += ""; $body += $ci; $body += "" }
          if ($docs)     { $body += "### Documentation"; $body += ""; $body += $docs; $body += "" }
          if ($others)   { $body += "### Other Changes"; $body += ""; $body += $others; $body += "" }
          $body -join "`r`n" | Out-File -FilePath release-body.md -Encoding utf8
          Write-Host "Release body generated:"
          Get-Content release-body.md

      - name: Write Version
        run: |
          echo "${{ steps.version_step.outputs.GitVersion_FullSemVer }}" > ./VERSION.txt

      - name: Build App
        run: |
          invoke deploy
          Rename-Item -Path "main.exe" -NewName "sensetool-${{ steps.version_step.outputs.GitVersion_FullSemVer }}.exe"

      - name: Create Release
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.GitVersion_FullSemVer }}
          name: Release ${{ steps.version_step.outputs.GitVersion_FullSemVer }}
          body_path: release-body.md
          draft: false
          prerelease: false
          files: sensetool-${{ steps.version_step.outputs.GitVersion_FullSemVer }}.exe
