name: SenseTool CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  packages: write
  contents: write

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Libraries Qt needs to run headless
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Lint Python
        run: uv run ruff check .

      - name: Lint QML
        run: uv run pyside6-qmllint $(find qml -name '*.qml')

      - name: Python tests (with coverage)
        run: |
          uv run coverage run --source=src -m unittest -v
          uv run coverage report

      - name: QML tests
        run: uv run python tests/run_qml_tests.py

  build:
    name: SenseTool Deployment
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GitVersion 5 as a dotnet tool: the GitVersion actions that run on Node 24
      # (v4+) require GitVersion 6/7, whose default rules would change the
      # release numbering. 5.12.0 is the last 5.x; roll forward to the runner's .NET.
      - name: Install GitVersion
        run: dotnet tool install --global GitVersion.Tool --version 5.12.0

      - name: Determine Version
        id: version_step
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          $version = dotnet-gitversion /showvariable FullSemVer
          if (-not $version) { throw "GitVersion produced no version" }
          "GitVersion_FullSemVer=$version" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: "6.7.0"
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtcharts qt5compat qtshadertools"
          dir: "${{ github.workspace }}/Qt/"
          install-deps: "true"

      - name: Install Invoke & other deps
        run: |
          pip install --upgrade pip
          pip install invoke
          pip install -r requirements.txt

      - name: Install 7-Zip with Chocolatey
        run: |
          choco install 7zip -y

      - name: get Dumpbin & add to path
        run: |
          curl -Lo dumpbin.zip https://github.com/Delphier/dumpbin/releases/download/v14.40.33811/dumpbin-14.40.33811-x64.zip
          7z x dumpbin.zip -odumpbin
          echo "${{ github.workspace }}\dumpbin" >> $env:GITHUB_PATH

      - name: Get Version and save to VERSION.txt
        run: |
          echo "${{ steps.version_step.outputs.GitVersion_FullSemVer }}" >> ./VERSION.txt

      - name: Deploy App
        run: |
          invoke deploy
          Rename-Item -Path "main.exe" -NewName "sensetool.exe"

      # One Node 24 action instead of the archived create-release + upload-release-asset (Node 12).
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version_step.outputs.GitVersion_FullSemVer }}
          name: Release ${{ steps.version_step.outputs.GitVersion_FullSemVer }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: sensetool.exe
