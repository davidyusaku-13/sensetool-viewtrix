name: SenseTool CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy release"
        required: false
        default: false
        type: boolean

env:
  QT_VERSION: "6.7.0"
  PYTHON_VERSION: "3.11"

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          # Exclude some combinations to reduce CI time
          - os: ubuntu-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.10"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-tools-dev
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt6
          echo "/opt/homebrew/opt/qt6/bin" >> $GITHUB_PATH

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtcharts qt5compat qtshadertools"
          cache: true
          install-deps: "true"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install invoke pytest pytest-cov pytest-xvfb
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Type check with mypy
        continue-on-error: true
        run: |
          pip install mypy types-PyYAML
          mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=html
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt

      - name: Run safety check
        run: safety check

      - name: Run bandit security scan
        run: bandit -r src/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  build:
    name: Build & Deploy
    needs: [test, security]
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event.inputs.deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.2.0
        with:
          versionSpec: "5.x"

      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v1.2.0
        with:
          useConfigFile: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: "windows"
          target: "desktop"
          arch: "win64_mingw"
          modules: "qtcharts qt5compat qtshadertools"
          cache: true
          install-deps: "true"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install invoke
          pip install -r requirements.txt

      - name: Install build tools
        run: |
          choco install 7zip -y

      - name: Setup Visual Studio Build Tools (includes dumpbin)
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Add Visual Studio tools to PATH
        run: |
          $vsPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          if (Test-Path $vsPath) {
            $latestVersion = Get-ChildItem $vsPath | Sort-Object Name -Descending | Select-Object -First 1
            $dumpbinPath = "$vsPath\$($latestVersion.Name)\bin\Hostx64\x64"
            echo $dumpbinPath >> $env:GITHUB_PATH
          } else {
            Write-Host "Visual Studio not found, skipping dumpbin setup"
          }

      - name: Add Qt tools to PATH
        run: |
          echo "${{ github.workspace }}\Qt\${{ env.QT_VERSION }}\win64_mingw\bin" >> $env:GITHUB_PATH

      - name: Run final tests
        run: |
          invoke test

      - name: Update version file
        run: |
          echo "${{ steps.version_step.outputs.GitVersion_FullSemVer }}" | Out-File -FilePath "./VERSION.txt" -Encoding utf8

      - name: Build application
        run: |
          invoke deploy
          if (Test-Path "main.exe") {
            Rename-Item -Path "main.exe" -NewName "sensetool.exe"
          } else {
            Write-Error "Build failed: main.exe not found"
            exit 1
          }

      - name: Verify build
        run: |
          if (!(Test-Path "sensetool.exe")) {
            Write-Error "Build verification failed: sensetool.exe not found"
            exit 1
          }
          $fileSize = (Get-Item "sensetool.exe").Length
          Write-Output "Build successful. File size: $fileSize bytes"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sensetool-windows-${{ steps.version_step.outputs.GitVersion_FullSemVer }}
          path: |
            sensetool.exe
            VERSION.txt
            CHANGELOG.md
          retention-days: 30

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version_step.outputs.GitVersion_FullSemVer }}
          name: Release v${{ steps.version_step.outputs.GitVersion_FullSemVer }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.version_step.outputs.GitVersion_FullSemVer, '-') }}
          files: |
            sensetool.exe
            VERSION.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
